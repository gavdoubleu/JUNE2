# Contact matrices for plague simulation
#
# Two venue types: household, land
# Two transmission modes: animal_bite (flea/rat vector), respiratory (droplet)
#
# Each ContactMatrix entry contains:
#   bins     - subset names (single bin "all" used here)
#   contacts - mean contacts per delta_t; enters force-of-infection as:
#              Omega = delta_t * C / N_bin
#

# ── Default matrix ────────────────────────────────────────────────────────────
# Stands in for any (venue, mode) pair with no entry of its own. Every venue
# type below declares both modes explicitly, so nothing here is reached; a pair
# that did reach it would be named at startup and refused, since
# allow_default_matrix is not set.
default_contacts_matrix:
  modes:
    animal_bite:
      bins: ["all"]
      contacts: [[1.0]]
    respiratory:
      bins: ["all"]
      contacts: [[1.0]]

# ── Per-venue, per-mode matrices ──────────────────────────────────────────────
contact_matrices:

  household:
    modes:
      animal_bite:
        # Rats nest in thatch roofs and walls; fleas are endemic in medieval homes.
        bins: ["all"]
        contacts: [[1.0]]

      respiratory:
        # Household members share a small, poorly ventilated space.
        bins: ["all"]
        contacts: [[1.0]]

  church:
    modes:
      animal_bite:
        bins: ["male", "female"]
        contacts:
          - [1.0, 0.2]
          - [0.2, 1.0]
      respiratory:
        bins: ["male", "female"]
        contacts:
          - [1.0, 0.5]
          - [0.5, 1.0]

  fair:
    modes:
      animal_bite:
        # Livestock and vermin present at market; lower exposure than household.
        bins: ["all"]
        contacts: [[0.5]]
      respiratory:
        # Dense crowds; higher contact rate than church or household.
        bins: ["all"]
        contacts: [[2.0]]

  guest_house:
    modes:
      animal_bite:
        # Rat-infested taverns and inns; higher exposure than household.
        bins: ["all"]
        contacts: [[1.2]]
      respiratory:
        # Shared rooms; slightly lower than household (not family).
        bins: ["all"]
        contacts: [[0.8]]

  land:
    modes:
      animal_bite:
        # Rats present in grain stores and open fields; exposure during working hours.
        bins: ["0-12", "male", "female"]
        contacts:
          - [0.33, 0.13, 0.13]
          - [0.13, 0.23, 0.13]
          - [0.13, 0.13, 0.23]

      respiratory:
        # Outdoor work gives more space; respiratory spread is lower than indoors.
        bins: ["0-12", "male", "female"]
        contacts:
          - [0.23, 0.05, 0.05]
          - [0.05, 0.05, 0.05]
          - [0.05, 0.05, 0.13]


