# Contact matrices for the sex and age bins scenario.
#
# One block per venue type and per transmission mode. A mode block has
#   beta      per-mode transmission rate at that venue type, multiplied into
#             every entry of `contacts` when the file is read
#   bins      who is in each row and column of the matrix
#   contacts  contacts per person per day, [observer bin][other bin]
#
# Every mode of a venue type must use the same bins.
#
# A person is put into a bin by, in this order:
#   1. their subset in the venue, when the subset name is one of the bins;
#   2. their sex, when the bins are named male and female;
#   3. their age, when the bins are age bands, written "min-max", "min+" or
#      "[min,max]" in whole years.
# Anyone who matches nothing goes to the first bin. A visitor from another MPI
# rank is binned on the sex and age it has at home, so the result does not
# depend on the rank count. Here gym and pub use sex bins and cinema uses age
# bins, which is what this fixture exists to exercise.

# The scenario has three modes. fomite rows carry a zero beta on purpose:
# fomite transmission is driven by the deposits in each venue (see disease.yaml),
# and these rows exist only so that every mode has the same bins.

# When a (venue type, mode) pair has no matrix of its own, the loader refuses to
# start unless this is true, and then lists the pairs that borrowed the default.
# boarding_school and student_dorms are left out below to show it.
allow_default_matrix: true

default_contacts_matrix:
    modes:
        respiratory:
            beta: 0.0375
            bins: [all]
            contacts:
                - [20]
        physical_contact:
            beta: 0.0083333333
            bins: [all]
            contacts:
                - [20]
        fomite:
            beta: 0.0
            bins: [all]
            contacts:
                - [0.0]

