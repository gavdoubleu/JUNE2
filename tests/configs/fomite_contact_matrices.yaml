    respiratory:
      beta: 0.0375
      bins: [all]
      contacts:
      - [20]
    physical_contact:
      beta: 0.0083333333
      bins: [all]
      contacts:
      - [20]
    fomite:
      beta: 0.0
      bins: [all]
      contacts:
      - [0.0]
