# Test-only: generated from configs/config_2021/contact_matrices.yaml with a
# zero-beta 'fomite' mode added to every venue type (bins copied from
# respiratory). Fomite lambda reads venue fomite_history, not these matrices;
# the entries exist only to satisfy the per-mode bins checks.
