campaigns:
  # A budgeted rollout: 300 doses every 7 days, shared by the tiers in order
  # (second doses first), stopping first doses at half the population. Each
  # tier's uptake is the share of people who accept; the rest are not asked
  # again.
  "Care Home Pfizer":
    start_date: "2024-01-01"
    end_date: "2024-01-20"
    days_to_next_dose: [0, 14]
    vaccine_type: "Pfizer"
    dose_budget: {doses: 300, per_days: 7}
    coverage_target: 0.5
    tiers:
      - name: care_home_second_dose
        dose: 1
        selection:
          - property: "activities.residence.venue_type"
            operator: "=="
            value: "care_home"
        uptake: 0.9
      - name: care_home_first_dose
        dose: 0
        selection:
          - property: "activities.residence.venue_type"
            operator: "=="
            value: "care_home"
        uptake:
          - selection:
              - property: "age"
                operator: ">="
                value: 85
            probability: 0.95
          - probability: 0.8

  # No budget and no uptake: everyone in the tiers is dosed as soon as they are
  # due.
  "Care Home AstraZeneca":
    start_date: "2024-01-01"
    end_date: "2024-01-20"
    days_to_next_dose: [0, 14]
    vaccine_type: "AstraZeneca"
    tiers:
      - name: care_home_second_dose
        dose: 1
        selection:
          - property: "activities.residence.venue_type"
            operator: "=="
            value: "care_home"
      - name: care_home_first_dose
        dose: 0
        selection:
          - property: "activities.residence.venue_type"
            operator: "=="
            value: "care_home"

  "Care Home Pfizer Booster":
    start_date: "2024-02-15"
    end_date: "2024-02-27"
    days_to_next_dose: [0]
    vaccine_type: "Pfizer"
    courses_begun_with: ["Pfizer", "AstraZeneca"]
    tiers:
      - name: care_home_booster
        dose: 2
        selection:
          - property: "activities.residence.venue_type"
            operator: "=="
            value: "care_home"
